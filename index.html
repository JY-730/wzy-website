<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>衍 的小桌面 · Demo v0.5</title>
<meta name="description" content="衍的个人网站 v3 设计验证 Demo：单屏满幅插画 + 物件悬停高亮 + 钻取卡片">
<meta property="og:title" content="衍 的小桌面">
<meta property="og:description" content="衍的个人网页：野餐桌面上的兴趣爱好、随笔盲盒、技能与关于我">
<meta property="og:type" content="website">
<meta property="og:image" content="https://arae7rff.qwenwork.host/assets/picnic-scene.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23F5821F'/><text x='32' y='45' font-size='34' text-anchor='middle' fill='%23FFFDF6' font-family='KaiTi,STKaiti,serif'>衍</text></svg>">
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
<style>
  /* 手写体槽位：自托管文件 > local() 别名 > 免费手写回退 > 系统栈 */
  @font-face{
    font-family:"WzyHand";
    src:local("AaShuMoShiHua"),local("AaShuiMoShiHua"),local("Aa Shui Mo Shi Hua"),local("AaShuimoShihua"),local("Aa水墨诗画"),
       url("assets/fonts/wzy-hand.woff2") format("woff2"),
       url("assets/fonts/wzy-hand.ttf") format("truetype");
    font-display:swap;
  }
  :root{
    --orange:#F5821F;
    --orange-2:#FF8A3D;
    --cream:#FFF6EC;
    --paper:#FFFDF6;
    --ink:#3B2A20;
    --muted:#8A6F5C;
    --green:#7FB77E;
    --peach:#E8A87C;
    --brick:#C97B63;
    --font-hand:"WzyHand","Ma Shan Zheng","KaiTi","STKaiti","楷体",cursive;
    --font-round:var(--font-hand);
    --font-body:var(--font-hand);
    --spring:cubic-bezier(.2,1.4,.4,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{background:var(--cream);color:var(--ink);font-family:var(--font-body);font-weight:400;line-height:1.7}
  h1,h3,h4{font-weight:400}
  button{font-family:inherit;color:inherit}
  [hidden]{display:none!important}

  /* ---------- 满幅舞台 ---------- */
  .stage{position:fixed;inset:0;overflow:hidden}
  .blur-layer{position:absolute;inset:0;transition:filter .35s ease,transform .35s ease}
  .stage.blurred .blur-layer{filter:blur(10px);transform:scale(1.04)}
  .stage.blurred .mail-fab{opacity:.35}
  .stage>img.bg,.blur-layer>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 62%;user-select:none;-webkit-user-drag:none}

  /* ---------- 热区（无可见选中框） ---------- */
  .hs{position:absolute;background:transparent;border:none;cursor:pointer;border-radius:26px;z-index:5}
  .hs:focus{outline:none}

  /* ---------- 物件图层：悬停放大 1.12× + 6px 白亮描边光晕 ---------- */
  .obj-layer{
    position:absolute;pointer-events:none;
    transition:transform .46s cubic-bezier(.34,1.3,.5,1);
    will-change:transform;
  }
  .obj-layer>img{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
  .obj-layer .ol-glow{
    opacity:0;
    filter:url(#f-ring) drop-shadow(0 0 7px rgba(255,255,255,.75));
    transition:opacity .26s ease;
  }
  .obj-layer .ol-art{opacity:1}
  .obj-layer.on{transform:scale(1.12)}
  .obj-layer.on .ol-glow{opacity:1}
  .svg-defs{position:absolute;width:0;height:0;overflow:hidden}

  /* ---------- 无边框浮现文字（无气泡边框） ---------- */
  .flabel{
    --fx:0px;--fy:0px;
    position:absolute;z-index:30;pointer-events:none;
    font-family:var(--font-round);
    font-size:clamp(17px,1.8vw,27px);
    letter-spacing:.16em;white-space:nowrap;
    color:#ffffff;
    text-shadow:0 3px 16px rgba(56,32,12,.85),0 1px 3px rgba(56,32,12,.7);
    opacity:0;visibility:hidden;
    transform:translate(var(--fx),var(--fy));
    transition:opacity .3s ease,transform .46s var(--spring),visibility 0s linear .34s;
  }
  .flabel.show{
    opacity:1;visibility:visible;
    transform:translate(0,0);
    transition:opacity .28s ease,transform .46s var(--spring),visibility 0s;
  }

  /* ---------- 草地 hello + 风吹草动 ---------- */
  .hello-wrap{position:absolute;left:5%;top:8%;max-width:90vw;pointer-events:none;z-index:8}
  .hello{
    display:inline-block;
    font-size:clamp(28px,4.2vw,60px);
    font-weight:400;font-synthesis:none;
    letter-spacing:.1em;white-space:nowrap;
    color:#ffffff;
    text-shadow:0 4px 22px rgba(58,34,14,.55),0 2px 6px rgba(58,34,14,.4);
    animation:helloIn .8s var(--spring) both;
  }
  @keyframes helloIn{0%{opacity:0;transform:translateY(18px)}100%{opacity:1;transform:none}}

  /* ---------- 右上角留言图标 ---------- */
  .mail-fab{
    position:absolute;top:18px;right:18px;z-index:40;
    width:54px;height:54px;border-radius:50%;
    background:var(--paper);border:3px solid var(--ink);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:transform .12s ease,background .12s ease;
  }
  .mail-fab:hover{transform:rotate(-8deg) scale(1.08)}
  .mail-fab.active{background:var(--orange);color:var(--paper)}
  .mail-fab .lic{width:24px;height:24px}

  /* ---------- 钻取卡片 ---------- */
  .card{
    position:absolute;z-index:20;
    width:min(420px,calc(100vw - 32px));
    max-height:min(72vh,640px);
    background:var(--paper);
    border:none;
    box-shadow:0 8px 28px rgba(59,42,32,.12);
    border-radius:26px;
    display:flex;flex-direction:column;
    animation:cardIn .42s var(--spring);
  }
  @keyframes cardIn{0%{opacity:0;scale:.55;rotate:-3deg}100%{opacity:1;scale:1;rotate:0deg}}
  .card-head{
    display:flex;align-items:center;gap:10px;
    padding:14px 16px 10px;
    border-bottom:3px dashed var(--peach);
  }
  .card-head h3{font-family:var(--font-round);font-size:21px;letter-spacing:.04em;flex:1;display:flex;align-items:center;gap:8px}
  .card-head h3 .lic{width:20px;height:20px;color:var(--orange);flex:none}
  .icon-btn{
    width:36px;height:36px;border-radius:50%;flex:none;
    background:transparent;border:3px solid var(--peach);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:transform .12s ease,background .12s ease;
  }
  .icon-btn:hover{transform:scale(1.12);background:var(--cream)}
  .icon-btn .lic{width:18px;height:18px}
  .card-body{padding:16px 20px 20px;overflow-y:auto;overscroll-behavior:contain}
  .card-body.in{animation:bodyIn .32s var(--spring)}
  .card-body.out{animation:bodyOut .14s ease forwards}
  @keyframes bodyIn{0%{opacity:0;transform:translateX(26px) scale(.96)}100%{opacity:1;transform:none}}
  @keyframes bodyOut{to{opacity:0;transform:translateX(-18px) scale(.97)}}

  .todo{color:var(--brick);font-size:.8em;border:2px dashed var(--brick);border-radius:8px;padding:0 6px;margin-left:4px;white-space:nowrap}

  .sub-entry{
    width:100%;display:flex;align-items:center;gap:10px;
    background:var(--cream);border:3px solid var(--green);border-radius:18px;
    padding:10px 16px;margin-top:12px;cursor:pointer;
    font-family:var(--font-round);font-size:16px;
    transition:transform .12s ease;
  }
  .sub-entry:hover{transform:translateX(6px)}
  .sub-entry .lic{width:18px;height:18px;margin-left:auto}

  .photo-slots{display:flex;gap:12px;margin-top:14px}
  .photo-slot{
    flex:1;min-height:110px;border:3px dashed var(--peach);border-radius:18px;
    display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;
    color:var(--muted);font-size:13px;background:var(--cream);
  }
  .photo-slot.photo{padding:0;border:none;background:transparent;min-height:0}
  .photo-slot.photo img{
    width:100%;height:auto;display:block;
    border-radius:14px;border:3px solid var(--peach);
    box-shadow:0 4px 14px rgba(59,42,32,.14);
  }
  /* 关于我：真实简介 */
  .me-intro{font-size:14px;line-height:1.9}
  .me-intro b{color:var(--orange);font-size:1.15em;margin:0 2px;font-family:var(--font-round)}
  /* 邮箱 / 微信 */
  .social-row{cursor:default}
  .social-row .s-ico{display:flex;flex:none}
  .social-row .s-ico .lic{width:20px;height:20px;color:var(--orange)}
  .social-row .s-name{font-family:var(--font-round);font-size:15px;flex:none;min-width:42px}
  .social-row .s-value{
    margin-left:auto;font-size:13px;color:var(--muted);
    word-break:break-all;text-align:right;cursor:pointer;
    transition:color .15s ease;
  }
  .social-row .s-value:hover{color:var(--orange)}
  .social-row.copied{border-color:var(--green)}
  .social-row.copied .s-value{color:var(--green);font-weight:bold}
  .s-tip{color:var(--muted);font-size:12px;margin-top:12px;text-align:center}
  .mbti-tag{margin-top:14px;text-align:center;font-size:12px;color:var(--muted)}
  .photo-slot .lic{width:22px;height:22px}

  .hobby-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .hobby-card{background:var(--cream);border:3px solid var(--green);border-radius:18px;padding:12px 14px;transition:transform .12s ease}
  .hobby-card:hover{transform:translateY(-4px) rotate(-1deg)}
  .hobby-card.empty{border-style:dashed;border-color:var(--peach);color:var(--muted)}
  .hobby-card .h-ico{font-size:24px}
  .hobby-card .h-name{font-family:var(--font-round);font-size:16px}
  .hobby-card .h-desc{font-size:12px;color:var(--muted)}

  .sandwich{margin:4px auto 0;max-width:320px}
  .bread{background:#E9C08A;border:3px solid var(--ink);border-radius:60px 60px 12px 12px;height:26px;margin-bottom:-5px;position:relative;z-index:1}
  .bread.bottom{border-radius:12px 12px 60px 60px;margin:-5px 0 0}
  .layer{
    width:100%;border:3px solid var(--ink);border-radius:12px;background:var(--cream);
    padding:7px 16px;margin:-3px 8px;position:relative;
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    font-family:var(--font-round);font-size:15px;cursor:pointer;
    transition:transform .12s ease;
  }
  .layer:hover{transform:scale(1.04)}
  .layer.empty{border-style:dashed;color:var(--muted);background:transparent;cursor:default}
  .layer .lv{font-size:11px;border-radius:999px;padding:1px 10px;color:var(--paper);font-family:var(--font-body)}
  .lv.l1{background:var(--green)} .lv.l2{background:var(--orange)} .lv.l3{background:var(--brick)}
  .detail-tag{display:inline-block;border-radius:999px;padding:2px 14px;color:var(--paper);font-size:13px;margin-bottom:8px}

  /* 盲盒 */
  .bb-stage{text-align:center;padding:4px 0}
  .bb-basket{font-size:64px;line-height:1;display:inline-block}
  .bb-basket.shaking{animation:shake .6s ease}
  @keyframes shake{0%,100%{transform:translateX(0) rotate(0)}20%{transform:translateX(-7px) rotate(-5deg)}40%{transform:translateX(7px) rotate(5deg)}60%{transform:translateX(-5px) rotate(-4deg)}80%{transform:translateX(5px) rotate(4deg)}}
  .bb-fruit{
    font-size:52px;cursor:pointer;background:var(--cream);
    border:4px solid var(--peach);border-radius:50%;
    width:96px;height:96px;line-height:88px;display:inline-block;
    animation:pop .38s var(--spring);transition:transform .12s ease;
  }
  .bb-fruit:hover{transform:scale(1.1) rotate(-8deg)}
  @keyframes pop{0%{scale:.2;opacity:0}70%{scale:1.15}100%{scale:1;opacity:1}}
  .bb-tip{color:var(--muted);font-size:13px;margin-top:8px;font-family:var(--font-round)}
  .bb-actions{margin-top:14px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--orange);color:var(--paper);border:none;
    border-radius:999px;padding:9px 22px;
    font-family:var(--font-round);font-size:15px;cursor:pointer;
    transition:transform .12s ease,background .12s ease;
  }
  .btn:hover{transform:translateY(-2px) scale(1.04);background:var(--orange-2)}
  .btn:active{transform:scale(.94)}
  .btn .lic{width:17px;height:17px}
  .btn.ghost{background:transparent;color:var(--ink);border:3px solid var(--peach);padding:6px 19px}
  .btn.ghost:hover{background:var(--cream)}
  .note-center{
    min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;gap:8px;animation:pop .3s var(--spring);
  }
  .note-center p{font-size:17px;letter-spacing:.06em}

  .mbti-letters{font-family:var(--font-round);font-size:46px;letter-spacing:.18em;color:var(--orange);text-align:center;margin:2px 0 8px}

  /* 留言 */
  .msg-form{display:grid;gap:10px}
  .msg-form input,.msg-form textarea{
    background:var(--cream);border:3px solid var(--peach);border-radius:14px;
    padding:8px 14px;font-size:14px;color:var(--ink);font-family:var(--font-body);resize:none;
  }
  .msg-form input:focus,.msg-form textarea:focus{outline:3px solid var(--orange-2);outline-offset:1px}
  .msg-form .row{display:flex;gap:10px;align-items:center}
  .msg-form .row input{flex:1;min-width:0}
  .msg-list{list-style:none;margin-top:14px;display:grid;gap:10px}
  .msg-item{
    background:var(--cream);border:3px solid var(--peach);border-radius:16px;padding:10px 14px;
    animation:pop .3s var(--spring);
    transition:transform .18s var(--spring),box-shadow .18s ease,border-color .18s ease;
  }
  /* 悬停浮动：抬起 + 投影 + 描边点亮（配色沿用站内 --orange / --peach） */
  .msg-item:hover{
    transform:translateY(-5px);
    box-shadow:0 10px 22px rgba(59,42,32,.15);
    border-color:var(--orange);
  }
  .msg-item:hover .m-nick{color:var(--brick)}
  .msg-item:hover .msg-reply{border-left-color:var(--brick)}
  .msg-item .m-head{display:flex;justify-content:space-between;gap:8px;align-items:center}
  .msg-item .m-left{display:inline-flex;align-items:center;gap:6px;min-width:0}
  .msg-item .m-nick{font-family:var(--font-round);color:var(--orange);font-size:15px;transition:color .18s ease}
  /* 被隐藏的留言：仅站主可见，用虚线框 + 降透明度区分 */
  .msg-item.hidden-msg{
    border-style:dashed;border-color:var(--muted);background:var(--paper);opacity:.62;
  }
  .msg-item.hidden-msg:hover{border-color:var(--muted);box-shadow:0 8px 18px rgba(59,42,32,.10)}
  .msg-item.hidden-msg .m-nick{color:var(--muted)}
  .m-hidden-tag{
    font-size:10px;color:var(--paper);background:var(--muted);
    border-radius:999px;padding:1px 7px;white-space:nowrap;flex:none;
  }
  .msg-item .m-time{font-size:11px;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
  .msg-item .m-time .lic{width:11px;height:11px}
  .msg-item .m-text{font-size:13px;margin-top:2px;word-break:break-word}

  /* ---------- 留言板 v2：自建微数据库后端 ---------- */
  .fab-badge{
    position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;
    border-radius:999px;background:var(--orange);color:var(--paper);
    font-size:11px;line-height:16px;text-align:center;padding:0 5px;
    border:2px solid var(--paper);font-family:var(--font-body);
    transform:scale(0);transition:transform .22s var(--spring);
  }
  .fab-badge.show{transform:scale(1)}
  .msg-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .msg-count{font-size:12px;color:var(--muted)}
  .msg-counter{font-size:12px;color:var(--muted);text-align:right}
  .msg-counter.over{color:var(--brick);font-weight:bold}
  .btn[disabled]{opacity:.55;cursor:not-allowed;transform:none!important}
  .msg-reply{
    margin-top:8px;padding:8px 12px;border-radius:12px;
    background:var(--paper);border-left:4px solid var(--orange);
    font-size:12.5px;color:var(--ink);line-height:1.7;
    transition:border-left-color .18s ease;
  }
  .msg-reply b{color:var(--orange);font-family:var(--font-round)}
  .msg-actions{display:flex;align-items:center;gap:8px;margin-top:8px}
  .msg-like{
    display:inline-flex;align-items:center;gap:5px;
    border:2px solid var(--peach);background:transparent;border-radius:999px;
    padding:2px 12px;font-size:12px;color:var(--muted);cursor:pointer;
    font-family:var(--font-body);
    transition:transform .12s ease,color .12s ease,border-color .12s ease;
  }
  .msg-like .lic{width:13px;height:13px}
  .msg-like:hover{transform:scale(1.06);color:var(--brick);border-color:var(--brick)}
  .msg-like.liked{color:var(--brick);border-color:var(--brick);cursor:default}
  .msg-like.pop{animation:likePop .3s var(--spring)}
  @keyframes likePop{0%{scale:.6}70%{scale:1.2}100%{scale:1}}

  /* ---------- 站主管理模式 ---------- */
  .own-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
  .own-chip{
    display:inline-flex;align-items:center;gap:4px;white-space:nowrap;flex:none;
    background:var(--orange);color:var(--paper);border-radius:999px;
    padding:2px 10px;font-size:11px;font-family:var(--font-round);
  }
  .own-chip .lic{width:13px;height:13px;flex:none}
  .own-exit{
    border:none;background:transparent;color:var(--muted);cursor:pointer;
    font-size:12px;font-family:var(--font-body);text-decoration:underline;
  }
  .own-exit:hover{color:var(--brick)}
  .own-mini{
    border:2px solid var(--peach);background:transparent;border-radius:999px;
    padding:2px 12px;font-size:12px;color:var(--muted);cursor:pointer;
    font-family:var(--font-body);transition:color .12s ease,border-color .12s ease;
  }
  .own-mini:hover{color:var(--orange);border-color:var(--orange)}
  .own-mini.danger:hover{color:var(--brick);border-color:var(--brick)}
  .own-pw{
    margin:0;padding:12px 14px;border:3px dashed var(--peach);border-radius:16px;
    background:var(--cream);
  }
  .own-pw p{font-size:12.5px;color:var(--muted);margin-bottom:8px;line-height:1.6}
  .own-pw .row{display:flex;gap:8px}
  .own-pw input{
    flex:1;min-width:0;border:3px solid var(--peach);border-radius:12px;
    padding:8px 10px;font-family:var(--font-body);font-size:13px;background:var(--paper);
  }
  .own-pw input:focus{outline:3px solid var(--orange-2);outline-offset:1px}
  .own-err{color:var(--brick)!important}
  .own-denied{
    margin-top:8px;padding:10px 12px;border:3px dashed var(--peach);
    border-radius:14px;background:var(--cream);font-size:12.5px;color:var(--muted);
    display:flex;align-items:center;justify-content:space-between;gap:8px;
  }
  .own-acts{display:flex;gap:8px;margin-top:8px}
  .own-reply-box{margin-top:8px}
  .own-reply-box textarea{
    width:100%;box-sizing:border-box;border:3px solid var(--peach);border-radius:12px;
    padding:8px 10px;font-family:var(--font-body);font-size:12.5px;background:var(--paper);
    color:var(--ink);resize:vertical;
  }
  .own-reply-box textarea:focus{outline:3px solid var(--orange-2);outline-offset:1px}
  .own-reply-box .row{display:flex;gap:8px;margin-top:6px;align-items:center}
  .msg-more{
    width:100%;margin-top:12px;background:transparent;color:var(--muted);
    border:3px dashed var(--peach);border-radius:14px;padding:8px;
    font-family:var(--font-round);font-size:14px;cursor:pointer;
  }
  .msg-more:hover{color:var(--orange);border-color:var(--orange)}
  .msg-empty,.msg-loading,.msg-notice{
    list-style:none;text-align:center;color:var(--muted);font-size:13px;
    padding:22px 12px;border:3px dashed var(--peach);border-radius:16px;
  }
  .msg-notice{border-color:var(--brick);color:var(--brick);text-align:left;font-size:12.5px;line-height:1.9}
  .msg-notice code{
    background:var(--cream);border-radius:6px;padding:1px 6px;
    font-family:Consolas,Menlo,monospace;font-size:12px;
  }
  .msg-toast{
    position:absolute;left:50%;bottom:88px;transform:translate(-50%,10px);
    z-index:60;background:var(--ink);color:var(--paper);
    border-radius:999px;padding:8px 20px;font-size:13.5px;
    font-family:var(--font-round);letter-spacing:.04em;
    opacity:0;pointer-events:none;

  var API_BASE = "https://yan-microdb.app.workbuddy.host";

  var owner = { token:"", on:false, asking:false, err:"", busy:false };

    var raw = lsGet(LS.owner);

    try{
      var o = JSON.parse(raw);

  function attempt(fn, fallback){

    catch(e){ return Promise.resolve(fallback); }
  }
  /* ---- HTTP 封装：统一超时、错误转换 ---- */
  function apiFetch(path, opts){
    opts = opts || {};
    var ctl = (typeof AbortController !== "undefined") ? new AbortController() : null;
    var timer = ctl ? setTimeout(function(){ ctl.abort(); }, 12000) : null;
    var headers = { "Content-Type": "application/json" };
    if(opts.auth && owner.token){
      /* X-Auth-Token 为主：CDN 网关会注入自己的 Authorization 头，服务端不能只认它。
         两个头都发，本机版（只认 Authorization）与线上版都能用同一份前端。 */
      headers["X-Auth-Token"] = owner.token;
      headers["Authorization"] = "Bearer " + owner.token;

      method: opts.method || "GET",
      headers: headers
    };

    if(ctl) init.signal = ctl.signal;
    return fetch(API_BASE + path, init).then(function(res){
      if(timer) clearTimeout(timer);

        if(!res.ok){

      var left = c.ox + a.x * c.scale + d.px + d.ax * w;
      var top  = c.oy + a.y * c.scale + d.py + d.ay * h;
      left = Math.min(Math.max(left, 12), Math.max(12, c.W - w - 12));
      top  = Math.min(Math.max(top, 12), Math.max(12, c.H - h - 12));
      f.style.left = left + "px";
      f.style.top = top + "px";
      f.style.setProperty("--fx", d.fx + "px");
      f.style.setProperty("--fy", d.fy + "px");
    });
  }

  /* ================= 留言板 v2 ================= */
  function fmtTime(d){
    var now = new Date();
    var diff = (now.getTime() - d.getTime()) / 1000;
    if(diff < 60) return "刚刚";
    if(diff < 3600) return Math.floor(diff / 60) + " 分钟前";
    if(diff < 86400) return Math.floor(diff / 3600) + " 小时前";
    /* 超过一天：显示留言当天的日期，如 2026.10.11 */
    var p = function(n){ return n < 10 ? "0" + n : String(n); };
    return d.getFullYear() + "." + p(d.getMonth() + 1) + "." + p(d.getDate());
  }

  function mountMail(){
    if(!store.ready) return;
    var f = document.getElementById("msgForm");
    if(f) f.addEventListener("submit", onMsgSubmit);
    var ta = document.getElementById("msgText");
    if(ta) ta.addEventListener("input", updateCounter);
    var opf = document.getElementById("ownForm");
    if(opf) opf.addEventListener("submit", onOwnerLogin);
    var oc = document.getElementById("ownCancel");
    if(oc) oc.addEventListener("click", function(){ owner.asking = false; owner.err = ""; render(true); });
    var oe = document.getElementById("ownExit");
    if(oe) oe.addEventListener("click", function(){ exitOwner("已退出管理模式"); });
    var more = document.getElementById("msgMore");
    if(more) more.addEventListener("click", function(){ loadMailPage(mail.page + 1); });
    updateCounter();
    reloadMail();
    if(owner.asking){
      var pw = document.getElementById("ownPw");
      if(pw) pw.focus();
    }

  function updateCounter(){
    var ta = document.getElementById("msgText"), c = document.getElementById("msgCounter");
    if(!ta || !c) return;
    var n = ta.value.length;
    c.textContent = n + " / 300";
    c.classList.toggle("over", n >= 300);
  }
  function setCountText(){
    var el = document.getElementById("msgCount");
    if(el) el.textContent = mail.total > 0 ? ("共 " + mail.total + " 条留言") : "";
  }
  function reloadMail(){
    mail.page = 0; mail.items = []; mail.done = false;
    var list = document.getElementById("msgList");
    if(list) list.innerHTML = "";
    var more = document.getElementById("msgMore");
    if(more) more.hidden = true;
    loadMailPage(0);
  }
  function loadMailPage(page){
    if(mail.loading || mail.done) return;
    mail.loading = true;
    var list = document.getElementById("msgList");
    var more = document.getElementById("msgMore");
    var loading = document.createElement("li");
    loading.className = "msg-loading";
    loading.textContent = "翻找留言中…";
    if(list && list.children.length === 0) list.appendChild(loading);
    var jobs = [ fetchMessages(page) ];
    if(page === 0) jobs.push(attempt(countMessages, -1));
    Promise.all(jobs).then(function(res){
      var raw = res[0] || [];
      var total = page === 0 ? res[1] : mail.total;
      mail.total = total;
      mail.page = page;
      if(list && loading.parentNode === list) list.removeChild(loading);
      /* 留言按时间顺序展示；有站主回复的，回复框内联显示在该条下方 */
      if(raw.length === 0 && page === 0){
        var empty = document.createElement("li");
        empty.className = "msg-empty";
        empty.textContent = "还没有留言，来抢沙发。";
        list.appendChild(empty);
      } else {
        raw.forEach(function(o){ list.appendChild(msgItemEl(msgPlain(o), false)); });
      }
      if(more) more.hidden = raw.length < PAGE_SIZE;
      /* 本页是否已取完：raw 未满一页说明后端已无更多数据 */
      mail.done = raw.length < PAGE_SIZE;
      mail.loading = false;
      setCountText();
      if(page === 0 && mail.total >= 0){
        badgeTotal = mail.total;
        markBadgeRead();
      }
      placeCard();
    }).catch(function(err){
      if(list && loading.parentNode === list) list.removeChild(loading);
      if(list){
        var e = document.createElement("li");
        e.className = "msg-notice";
        e.textContent = "留言加载失败：" + errText(err);
        list.appendChild(e);
      }
      if(more) more.hidden = true;
      mail.loading = false;
    });
  }

  /* ---- 管理模式动作 ---- */
  function exitOwner(msg){
    if(owner.token){
      /* 通知服务端作废会话，失败也不影响本地退出 */
      apiFetch("/api/owner/logout", { method:"POST", auth:true }).catch(function(){});
    }
    owner = { token:"", on:false, asking:false, err:"", busy:false };
    lsDel(LS.owner);
    if(msg) showToast(msg, true);
    if(view.obj === "mail" && !card.hidden) render(true);
  }
  function onOwnerLogin(e){
    e.preventDefault();
    if(owner.busy) return;
    var pwEl = document.getElementById("ownPw");
    var pw = pwEl ? pwEl.value : "";
    if(!pw){ owner.err = "请输入管理密码"; render(true); return; }
    owner.busy = true;
    var btn = document.getElementById("ownGo");
    if(btn){ btn.disabled = true; btn.className = "btn"; btn.textContent = "验证中…"; }
    apiFetch("/api/owner/login", { method:"POST", body:{ password: pw } }).then(function(d){
      owner.busy = false;
      owner.token = d.token;
      owner.on = true;
      owner.asking = false;
      owner.err = "";
      lsSet(LS.owner, JSON.stringify({ token:d.token, exp:d.expiresAt }));
      showToast("已进入管理模式");
      render(true);
    }).catch(function(err){
      owner.busy = false;
      owner.err = errText(err);
      render(true);
    });
  }
  function openReplyEditor(li, m){
    if(li.querySelector(".own-reply-box")) return;
    var box = document.createElement("div");
    box.className = "own-reply-box";
    var form = document.createElement("form");
    var ta = document.createElement("textarea");
    ta.rows = 2;
    ta.maxLength = 200;
    ta.placeholder = "回复 " + m.nick + "…";
    ta.value = m.reply || "";
    ta.setAttribute("aria-label", "回复内容");
    var row = document.createElement("div");
    row.className = "row";
    var save = document.createElement("button");
    save.type = "submit";
    save.className = "btn";
    save.textContent = "保存回复";
    var cancel = document.createElement("button");
    cancel.type = "button";
    cancel.className = "own-mini";
    cancel.textContent = "取消";
    row.appendChild(save);
    row.appendChild(cancel);
    form.appendChild(ta);
    form.appendChild(row);
    box.appendChild(form);
    form.addEventListener("submit", function(e){
      e.preventDefault();
      var val = (ta.value || "").trim();
      /* 原本没有回复又留空 → 提示；原本有回复但清空 → 确认后撤销 */
      if(!val){
        if(!m.reply){ showToast("回复内容不能为空", true); return; }
        if(!window.confirm("清空内容并撤销这条回复？")) return;
      }
      save.disabled = true;
      save.textContent = "保存中…";
      apiFetch("/api/owner/messages/" + encodeURIComponent(m.id) + "/reply",
        { method:"POST", auth:true, body:{ reply: val } }
      ).then(function(){
        showToast(val ? "回复已保存" : "回复已撤销");
        reloadMail();
      }).catch(function(err){
        save.disabled = false;
        save.textContent = "保存回复";
        showToast(errText(err), true);
      });
    });
    cancel.addEventListener("click", function(){ box.remove(); });
    li.appendChild(box);
    ta.focus();
  }
  function ownerDelete(m, li){
    if(!window.confirm("确定删除「" + m.nick + "」的这条留言？删除后无法恢复。")) return;
    apiFetch("/api/owner/messages/" + encodeURIComponent(m.id),
      { method:"DELETE", auth:true }
    ).then(function(){
      showToast("已删除");
      li.remove();
    }).catch(function(err){
      showToast(errText(err), true);
    });
  }
  function ownerToggleHidden(m, btn){
    var next = m.hidden ? "approved" : "pending";
    if(!m.hidden && !window.confirm("隐藏这条留言？访客将看不到它，你仍可在管理模式里恢复。")) return;
    btn.disabled = true;
    apiFetch("/api/owner/messages/" + encodeURIComponent(m.id) + "/status",
      { method:"POST", auth:true, body:{ status: next } }
    ).then(function(){
      showToast(m.hidden ? "已恢复显示" : "已隐藏");
      reloadMail();
    }).catch(function(err){
      btn.disabled = false;
      showToast(errText(err), true);
    });
  }
  function onLike(id, btn){
    if(isLiked(id)){ showToast("这条已经赞过啦"); return; }
    var numEl = btn.querySelector(".lk-n");
    var old = parseInt(numEl.textContent, 10) || 0;
    numEl.textContent = old + 1;
    btn.classList.add("liked", "pop");
    markLiked(id);
    likeMessage(id).catch(function(){
      numEl.textContent = old;
      btn.classList.remove("liked", "pop");
      showToast("点赞失败，稍后再试", true);
    });
  }
  function onMsgSubmit(e){
    e.preventDefault();
    if(mail.sending) return;
    var nickEl = document.getElementById("msgNick");
    var textEl = document.getElementById("msgText");
    var nick = nickEl.value.trim();
    var text = textEl.value.trim();

    /* 站主入口：昵称填「衍」、内容留空直接回车 → 进入管理模式验证 */
    if(nick === OWNER_NAME && !text){
      owner.asking = true;
      owner.err = "";
      render(true);
      return;
    }
    if(owner.asking) return;

    if(!nick || !text){ showToast("昵称和内容都要填哦", true); return; }
    if(rateLimited()){ showToast("休息一下，60 秒后再发一条", true); return; }
    mail.sending = true;
    var btn = document.getElementById("msgSubmit");
    btn.disabled = true;
    btn.innerHTML = icon("clock") + "发送中…";
    saveMessage(nick, text).then(function(){
      mail.sending = false;
      btn.disabled = false;
      btn.innerHTML = icon("send") + "留下";
      nickEl.value = ""; textEl.value = "";
      updateCounter();
      markSent();
      showToast("留言成功，感谢 ✓");
      reloadMail();
    }).catch(function(err){
      mail.sending = false;
      btn.disabled = false;
      btn.innerHTML = icon("send") + "留下";
      showToast(errText(err), true);
    });
  }

  /* ---- 留言角标（FAB 红点） ---- */
  var badgeEl = null;
  var badgeTotal = -1;
  function ensureBadge(){
    if(badgeEl) return badgeEl;
    badgeEl = document.createElement("span");
    badgeEl.className = "fab-badge";
    badgeEl.setAttribute("aria-hidden", "true");
    mailFab.appendChild(badgeEl);
    return badgeEl;
  }
  function refreshBadge(){
    ensureBadge();
    var mailOpen = (view.obj === "mail" && !card.hidden);
    if(!store.ready || badgeTotal < 0 || mailOpen){ badgeEl.classList.remove("show"); return; }
    var read = parseInt(lsGet(LS.read) || "0", 10) || 0;
    var unread = Math.max(0, badgeTotal - read);
    if(unread > 0){
      badgeEl.textContent = unread > 99 ? "99+" : String(unread);
      badgeEl.classList.add("show");
    } else {
      badgeEl.classList.remove("show");
    }
  }
  function markBadgeRead(){
    if(badgeTotal >= 0) lsSet(LS.read, String(badgeTotal));
    if(badgeEl) badgeEl.classList.remove("show");
  }
  function pollBadge(){
    if(!store.ready) return;
    countMessages().then(function(n){
      badgeTotal = n;
      refreshBadge();
    }).catch(function(){});
  }

  /* ---- 轻提示 toast ---- */
  var toastEl = null, toastTimer = null;
  function showToast(text, isErr){
    if(!toastEl){
      toastEl = document.createElement("div");
      toastEl.className = "msg-toast";
      stage.appendChild(toastEl);
    }
    toastEl.textContent = text;
    toastEl.classList.toggle("err", !!isErr);
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 2200);
  }

  function bodyHTML(){
    if(view.obj === "mail") return bodyMail();
    if(view.level === 2){
      if(view.obj === "hat") return bodyHat2();
      if(view.obj === "sandwich") return bodySandwich2();
      if(view.obj === "basket") return bodyBasket2();
    }
    return { hat:bodyHat1, guitar:bodyGuitar, sandwich:bodySandwich1, basket:bodyBasket1, grape:bodyGrape }[view.obj]();
  }

  function render(anim){
    cardTitle.innerHTML = headTitle();
    backBtn.hidden = !(view.level === 2);
    cardBody.innerHTML = bodyHTML();
    if(anim){
      cardBody.classList.remove("in");
      void cardBody.offsetWidth;
      cardBody.classList.add("in");
    }
    if(view.obj === "mail") mountMail();
    mailFab.classList.toggle("active", view.obj === "mail" && !card.hidden);
    setHover(null);
    placeCard();
  }

  function setView(obj, level, sub, opts){
    var first = card.hidden;
    view = { obj:obj, level:level, sub:sub==null?null:sub };
    if(obj === "mail"){
      mail = { page:0, total:-1, loading:false, sending:false, done:false };
    }
    card.hidden = false;
    stage.classList.add("blurred");
    if(first){
      render(false);
    } else {
      cardBody.classList.add("out");
      setTimeout(function(){
        cardBody.classList.remove("out");
        render(true);
        if(opts && opts.autodraw) startDraw();
      }, 140);
    }
    if(opts && opts.autodraw && first) startDraw();
  }

  function closeCard(){
    card.hidden = true;
    stage.classList.remove("blurred");
    view = { obj:null, level:1, sub:null };
    bb = { stage:"idle", note:null };
    mail = { page:0, total:-1, loading:false, sending:false, done:false };
    /* 收起时清掉密码面板状态；已验证的登录态保留 */
    owner.asking = false;
    owner.err = "";
    owner.busy = false;
    mailFab.classList.remove("active");
    setHover(null);
    refreshBadge();
  }

  function placeCard(){
    var W = stage.clientWidth, H = stage.clientHeight;
    var cw = card.offsetWidth, ch = card.offsetHeight;
    card.style.left = Math.max(16, (W - cw) / 2) + "px";
    card.style.top = Math.max(16, (H - ch) / 2) + "px";
  }

  /* ---- 盲盒动作 ---- */
  function startDraw(){
    bb.stage = "shaking";
    bb.note = drawNote();
    render(false);
    setTimeout(function(){ bb.stage = "fruit"; render(true); }, 650);
  }

  /* ---- 事件 ---- */
  SPOTS.forEach(function(s){
    var el = els[s.key];
    el.addEventListener("mouseenter", function(){ setHover(s.key); });
    el.addEventListener("mouseleave", function(){ if(hovered === s.key) setHover(null); });
    el.addEventListener("focus", function(){ setHover(s.key); });
    el.addEventListener("blur", function(){ if(hovered === s.key) setHover(null); });
    el.addEventListener("click", function(){
      /* 彩蛋：葡萄（MBTI）无任何悬停提示，只有点中才跳卡片 */
      setHover(null);
      if(view.obj === s.key && !card.hidden){ closeCard(); return; }
      if(s.key === "basket") bb = { stage:"idle", note:null };
      setView(s.key, 1, null);
    });
  });

  mailFab.addEventListener("click", function(){
    if(view.obj === "mail" && !card.hidden){ closeCard(); return; }
    setView("mail", 1, null);
  });
  closeBtn.addEventListener("click", closeCard);
  backBtn.addEventListener("click", function(){
    if(view.obj === "basket"){ bb = { stage: bb.note ? "fruit" : "idle" }; }
    setView(view.obj, 1, null);
  });

  cardBody.addEventListener("click", function(e){
    var v = e.target.closest(".s-value");
    if(v){ copyValue(v); return; }
    var t = e.target.closest("[data-act]");
    if(!t) return;
    var act = t.getAttribute("data-act");
    if(act === "drill"){ setView(view.obj, 2, t.getAttribute("data-sub")); return; }
    if(act === "bb-draw"){ startDraw(); return; }
    if(act === "bb-open"){ setView("basket", 2, bb.note.id); return; }
    if(act === "bb-again"){ setView("basket", 1, null, { autodraw:true }); return; }
    if(act === "bb-reset"){ bb = { stage:"idle", note:null }; render(true); return; }
  });

  /* ---- 复制邮箱 / 微信 ---- */
  function fallbackCopy(txt){
    var ta = document.createElement("textarea");
    ta.value = txt; ta.setAttribute("readonly", "");
    ta.style.position = "fixed"; ta.style.left = "-999px"; ta.style.top = "0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); }catch(err){}
    document.body.removeChild(ta);
  }
  function copyValue(el){
    var txt = el.textContent.trim();
    var row = el.closest(".social-row");
    if(row && row.classList.contains("copied")) return;
    var done = function(){
      if(!row) return;
      var old = el.textContent;
      row.classList.add("copied");
      el.textContent = "已复制 ✓";
      setTimeout(function(){ row.classList.remove("copied"); el.textContent = old; }, 1100);
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done, function(){ fallbackCopy(txt); done(); });
    } else { fallbackCopy(txt); done(); }
  }

  /* ---- 单屏拖拽平移（竖屏窄幅看全桌面） ---- */
  var dragging = false, lastX = 0;
  stage.addEventListener("pointerdown", function(e){
    if(e.target.closest(".hs,.card,.mail-fab,.demo-tag,.pan-hint,button,input,textarea,form,a")) return;
    var W = stage.clientWidth, H = stage.clientHeight;
    var scale = Math.max(W / IMG_W, H / IMG_H);
    if(IMG_W * scale <= W + 4) return;
    dragging = true; lastX = e.clientX;
    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener("pointermove", function(e){
    if(!dragging) return;
    var W = stage.clientWidth, H = stage.clientHeight;
    var scale = Math.max(W / IMG_W, H / IMG_H);
    var rw = IMG_W * scale;
    pan.x = Math.min(1, Math.max(0, pan.x - (e.clientX - lastX) / (rw - W)));
    lastX = e.clientX;
    panHint.classList.add("gone");
    layout();
  });
  ["pointerup","pointercancel"].forEach(function(ev){
    stage.addEventListener(ev, function(){ dragging = false; });
  });

  window.addEventListener("resize", layout);
  layout();

  /* ---- 留言板启动：初始化后端 + 角标轮询 ---- */
  initStore();
  ensureBadge();
  refreshBadge();
  pollBadge();
  setInterval(pollBadge, 60000);
})();
</script>
</body>
</html>
